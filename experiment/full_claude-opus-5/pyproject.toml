[project]
name = "governed-service-runner"
version = "0.1.0"
description = "A governed service request runner: plans, policy-controlled steps, and an append only log."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]
